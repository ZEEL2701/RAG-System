# Render Blueprint: https://render.com/docs/blueprint-spec
# Deploy: connect GitHub repo → New Blueprint → select this file

services:
  - type: web
    name: rag-gradio
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: GRADIO_SERVER_NAME
        value: 0.0.0.0
      - key: GRADIO_SHARE
        value: "false"
      - key: COLLECTION_NAME
        value: rag-pgvector
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: MAX_CONTEXT_DOCUMENTS
        value: "3"
      - key: SEARCH_K
        value: "5"
